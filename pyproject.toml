[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustport"
version = "0.1.0"
description = "Trustworthy multi-source information integration and policy evaluation for smart hospitals"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.2,<2.10",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "omegaconf>=2.3",
    "simple-parsing>=0.1.6",
    "rank-bm25>=0.2.2",
    "typing-extensions>=4.9",
]

[project.optional-dependencies]
hf = ["transformers>=4.40", "accelerate>=0.30"]
export = ["onnx>=1.16", "onnxscript>=0.1"]
dev = ["ruff", "black", "isort", "mypy", "pytest", "hypothesis"]

[project.scripts]
trustport = "trustport.wheelhouse.__main__:main"

[tool.setuptools.packages.find]
include = ["trustport*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["trustport"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["trustport"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["trustport"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
