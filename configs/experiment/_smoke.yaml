# for unit-test smoke only; do not use for reporting
name: smoke
seed: 42
format_gamma: 0.3
init_task_weights: [1.0, 1.5, 0.8, 0.8]
backbone:
  name: smoke
  vocab_size: 512
  hidden_dim: 32
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05
  max_seq_len: 64
tasks:
  ner_tags: 5
  relations: 6
  classes: 4
  answers: 4
pmc:
  alpha_policy: 0.35
  alpha_measure: 0.30
  alpha_content: 0.35
  top_k: 3
fusion:
  clinical_dim: 32
  policy_dim: 32
  kbi_dim: 16
  fused_dim: 32
  pathways: 4
trust:
  tau_trust: 0.6
  consistency_k: 3
  consistency_tau: 0.7
optim:
  lr: 5.0e-3
  batch_size: 8
  grad_accum: 1
  epochs: 1
  warmup_ratio: 0.0
  weight_decay: 0.01
  max_grad_norm: null
  ema_decay: 0.0
  precision: fp32
data:
  datasets: [bc5cdr, ccks17]
  documents: 32
  seq_len: 16
  signal_strength: 3.0
toggles:
  domain_adapt: true
  struct_out: true
  fusion: true
  trust: true
  rag: true
